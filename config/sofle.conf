# No underglow LEDs installed; underglow toggle also cut ext-power to the
# nice!view displays (shared rail), so disable the feature entirely.
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO=y

CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=25

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_NICE_VIEW_GEM_ANIMATION=n

# --- Battery / power ---
# Deep sleep was never enabled (no CONFIG_ZMK_SLEEP line = off by default),
# which is why both halves drained overnight. This is THE fix.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT_MS=900000

# --- Pointing / mouse (enables encoder horizontal + vertical scroll) ---
CONFIG_ZMK_POINTING=y
