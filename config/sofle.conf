# No underglow LEDs installed. The toggle key is removed from the keymap so it
# can no longer cut ext-power to the nice!view displays. Underglow left enabled
# (inert, no LEDs) — disabling it triggers Kconfig fallout (BRT_MAX/WS2812).
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO=y

CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=25

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_NICE_VIEW_GEM_ANIMATION=n

# --- Battery / power ---
# Deep sleep was never enabled (no CONFIG_ZMK_SLEEP line = off by default),
# which is why both halves drained overnight. This is THE fix.
CONFIG_ZMK_SLEEP=y
# (Idle timeout uses ZMK's built-in default ~15 min; the explicit
# *_IDLE_SLEEP_TIMEOUT_MS symbol is undefined in this ZMK version.)

# --- Pointing / mouse (enables encoder horizontal + vertical scroll) ---
CONFIG_ZMK_POINTING=y
